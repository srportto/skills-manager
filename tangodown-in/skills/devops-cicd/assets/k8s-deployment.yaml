# Deployment pronto para copiar — ajuste nome, imagem (tag versionada, nunca latest em produção) e recursos.
# Orçamento de shutdown: preStop (5 s) + spring.lifecycle.timeout-per-shutdown-phase (25 s) < terminationGracePeriodSeconds (40 s).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minha-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minha-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: minha-app
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minha-app
          image: minha-app:1.0.0          # troque pela tag/sha publicado pelo pipeline
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: minha-app-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:                   # protege a subida lenta da JVM sem afrouxar a liveness
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 24          # até 120 s para subir
          readinessProbe:                 # só esta réplica; banco compartilhado fica fora (degradação na app)
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:                  # só o estado do processo; nunca banco/broker/cache
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:                      # tempo para o endpoint sair do balanceador antes do SIGTERM
              sleep:                      # ação sleep: Kubernetes 1.30+; antes, exec com "sleep 5"
                seconds: 5
          resources:
            requests:
              memory: "768Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"             # requests = limits na memória (QoS Guaranteed); heap = 75% disso
              cpu: "1000m"
