# Pipeline CI mínimo para app Java/Maven — copie para .github/workflows/ci.yml.
# Mesmo estilo do .github/workflows/validar-catalogo.yml deste repositório.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, testes e empacotamento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 25 (Temurin) com cache do Maven
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      # Gate de qualidade: teste vermelho derruba o build. Nunca use -DskipTests aqui.
      - name: Build e testes
        run: mvn -B verify

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # Descomente se o projeto tiver perfil de integração (Testcontainers; o runner ubuntu tem Docker).
