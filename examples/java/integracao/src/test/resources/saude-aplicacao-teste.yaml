# Configuração dos health groups usada no teste (mesma semântica recomendada em monitoramento-java).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
        operacional:
          include: backlog
